<div class="register-box">
      <div class="register-logo">
        <a routerLink="/home">
          <b *ngIf="setting$ | async as setting">
            <span *ngIf="setting.logo; else another">
              <img [src]="'http://127.0.0.1:8080/uploads/' + setting.logo" alt="logo" class="img-circle" width="{{ setting.width}}" height="setting.height">
            </span>
            <ng-template #another>
                <!-- logo for regular state and mobile devices -->
                <span class="logo-lg"><b>{{ setting.nameApp }}</b></span>
            </ng-template>
          </b>
        </a>
      </div>

      <div class="register-box-body">
        <h4 class="login-box-msg">S'incrire</h4>
        <p><em class="pull-right">Tous les champs sont obligatoires</em></p>
        <br>
        <form #form="ngForm" (ngSubmit)="register(form)">
          <div class="form-group has-feedback">
            <input type="text"
                    name="username"
                    [(ngModel)]="registerData.username"
                    class="form-control"
                    required>
            <span class="glyphicon glyphicon-user form-control-feedback"></span>
          </div>
          <div class="form-group has-feedback">
            <input type="email" name="email"
                    [(ngModel)]="registerData.email"
                    class="form-control"
                    required placeholder="Email">
            <span class="glyphicon glyphicon-envelope form-control-feedback"></span>
          </div>
          <div class="form-group has-feedback">
            <input type="password"
                    name="password"
                    [(ngModel)]="registerData.password"
                    class="form-control"
                    required
                    placeholder="Password">
            <span class="glyphicon glyphicon-lock form-control-feedback"></span>
          </div>
          <div class="form-group has-feedback">
            <input type="password"
                    name="confirmPassword"
                    [(ngModel)]="registerData.confirmPassword"
                    class="form-control"
                    required
                    placeholder="Retype password">
            <span class="glyphicon glyphicon-log-in form-control-feedback"></span>
          </div>

          <div class="text-danger" *ngIf="errorMessage">
                              {{ errorMessage }}
                            </div>

                            <div class="text-success" *ngIf="successMessage">
                              {{ successMessage }}
                            </div>
          <div class="row">
            <div class="col-xs-12">
              <button type="submit" [disabled]="form.invalid" class="btn btn-primary btn-block btn-flat">S'inscrire</button>
            </div>
          </div>
        </form>
      <br>
      <a routerLink="/login" class="text-center">Je suis déjà membre</a>
      </div><!-- /.form-box -->
    </div><!-- /.register-box -->

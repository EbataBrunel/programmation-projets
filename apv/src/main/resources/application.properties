spring.application.name=apv

# ============================================================
# BASE DE DONNÉES
# ============================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ============================================================
# JWT
# ============================================================

app.secret-key=${JWT_SECRET_KEY}
app.jwt-expiration=86400000

# ============================================================
# STRIPE
# ============================================================

stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

# ============================================================
# FICHIERS
# ============================================================

file.upload-dir=${UPLOAD_DIR:/app/uploads}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=30MB
spring.servlet.multipart.file-size-threshold=20MB

# ============================================================
# EMAIL
# ============================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ============================================================
# FRONTEND
# ============================================================

app.frontend.url=${FRONTEND_URL:https://lisungi-x9vx.onrender.com}

# ============================================================
# GOOGLE RECAPTCHA
# ============================================================

google.recaptcha.secret=${RECAPTCHA_SECRET}

# ============================================================
# SERVEUR
# ============================================================

server.port=${PORT:8080}
<div class="login-box">
      <div class="login-logo">
        <a routerLink="/home">
          <b *ngIf="setting$ | async as setting">
            <span *ngIf="setting.logo; else another">
              <img [src]="setting.logo" alt="logo" class="img-circle" width="{{ setting.width}}" height="setting.height">
            </span>
            <ng-template #another>
                <!-- logo for regular state and mobile devices -->
                <span class="logo-lg"><b>{{ setting.nameApp }}</b></span>
            </ng-template>
          </b>
        </a>
      </div><!-- /.login-logo -->
      <div class="login-box-body">

        <h4 class="login-box-msg">S'authentifier</h4>
        <p><em class="pull-right">Tous les champs sont obligatoires</em></p>
        <br>
        <form [formGroup]="form" (ngSubmit)="login()">
          <div class="form-group has-feedback">
            <input type="text"
              class="form-control"
              formControlName="username"
              placeholder="Entrer le username">
            <span class="glyphicon glyphicon-envelope form-control-feedback"></span>
          </div>
          <div class="form-group has-feedback">
            <input  type="password"
              class="form-control lock-input"
              formControlName="password"
              placeholder="Mot de passe">
            <span class="glyphicon glyphicon-lock form-control-feedback"></span>
          </div>

          <div *ngIf="errorMessage" class="alert alert-danger">
            {{ errorMessage }}
          </div>

        <div class="row">
            <div class="col-md-6 col-xs-6">
              <p class="pull-left"><a routerLink="/forgot-password">Mot de passe oublié ?</a></p>
            </div>
            <div class="col-md-6 col-xs-6">
              <p class="pull-right"><a routerLink="/register" class="text-center">S'inscrire</a></p>
            </div>
        </div>

        <div class="row">

            <div class="col-xs-12">
              <button type="submit"
                class="btn btn-block btn-primary"
                [disabled]="form.invalid"
                class="btn btn-primary btn-block btn-flat">Se connecter</button>
            </div><!-- /.col -->

          </div>
        </form>
      </div><!-- /.login-box-body -->
    </div><!-- /.login-box -->

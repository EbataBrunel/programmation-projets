
    <!-- Automatic element centering -->
    <div class="lockscreen-wrapper">
      <div class="lockscreen-logo" *ngIf="setting$ | async as setting">
        <a routerLink="/home">
          <span *ngIf="setting.logo; else another">
              <img [src]="setting.logo" alt="logo" class="img-circle" width="{{ setting.width}}" height="setting.height">
          </span>
          <ng-template #another>
              <!-- logo for regular state and mobile devices -->
              <span class="logo-lg"><b>{{ setting.nameApp }}</b></span>
          </ng-template>
        </a>
      </div>

      <!-- START LOCK SCREEN ITEM -->
      <div class="lockscreen-item">
        <!-- /.lockscreen-image -->
        <div class="help-block text-center">
          Entrer votre email
        </div>
        <!-- lockscreen credentials (contains the form) -->
        <form [formGroup]="forgotForm" (ngSubmit)="submit()">
          <div class="form-group">
            <input type="email" formControlName="email" class="form-control" placeholder="email">
            <div *ngIf="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched">
              Email invalide
            </div>
          </div>
          <div class="form-group">
            <button type="submit" [disabled]="forgotForm.invalid" class="btn btn-primary btn-sm form-control"><i class="fa fa-arrow-right"></i> Valider </button>
          </div>
        </form><!-- /.lockscreen credentials -->
      </div><!-- /.lockscreen-item -->

      <div class="bg-mint">
        <p class="text-center text-white"><strong>{{ message }}</strong></p>
      </div>
      <div class="text-center">
        <a routerLink="/login"> Se connecter</a>
      </div>

    </div><!-- /.center -->
